name: Build C++ App

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Compile C++ program
      run: g++ tugas2.cpp -o tugas2.exe -static

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: hasil-exe
        path: tugas2.exe
