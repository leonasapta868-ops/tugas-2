
name: Build C++ to EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil kode dari repository
        uses: actions/checkout@v4

      - name: Siapkan compiler C++
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Compile C++ menjadi EXE
        shell: msys2 {0}
        run: g++ tugas2.cpp -o tugas2.exe

      - name: Simpan file EXE
        uses: actions/upload-artifact@v4
        with:
          name: hasil-exe
          path: tugas2.exe
